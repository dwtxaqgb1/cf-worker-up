<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日志 - CF 部署工具</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f5;color:#333;padding:15px;font-size:14px}
header{background:linear-gradient(135deg,#007bff,#0056b3);color:white;padding:14px 16px;border-radius:12px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:17px}
header a{color:white;text-decoration:none;background:rgba(255,255,255,0.2);padding:6px 12px;border-radius:6px;font-size:12px}
.card{background:white;padding:14px;border-radius:10px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,0.06)}
button{padding:10px 14px;border:none;border-radius:6px;font-size:13px;cursor:pointer;margin-bottom:8px}
.btn-blue{background:#17a2b8;color:white}
.log-item{padding:10px;background:#f8f9fa;border-radius:6px;margin-bottom:6px;font-size:12px;border-left:3px solid #17a2b8}
.log-time{color:#6c757d;font-family:Menlo,monospace;font-size:11px}
.log-action{font-weight:600;color:#17a2b8;margin-left:8px}
.log-summary{margin-top:4px;color:#495057;font-family:Menlo,monospace;font-size:11px;white-space:pre-wrap;word-break:break-all}
</style>
</head>
<body>
<header>
  <h1>操作日志</h1>
  <a href="/">返回主页</a>
</header>

<div class="card">
  <button class="btn-blue" id="reload">刷新</button>
  <div id="list"></div>
</div>

<script>
async function loadList(){
  const list = document.getElementById('list');
  list.innerHTML = '加载中...';
  const res = await fetch('/api/logs');
  if (res.status === 401) { location.href = '/'; return; }
  const data = await res.json();
  list.innerHTML = '';
  if (!data.logs.length) { list.innerHTML = '（暂无日志）'; return; }
  data.logs.forEach(l => {
    try {
      const entry = JSON.parse(l);
      const div = document.createElement('div');
      div.className = 'log-item';
      div.innerHTML = `
        <div><span class="log-time">${entry.time}</span><span class="log-action">${entry.action}</span> → 退出码 ${entry.result?.code ?? '-'}</div>
        ${entry.result?.summary ? '<div class="log-summary">' + entry.result.summary + '</div>' : ''}
      `;
      list.appendChild(div);
    } catch (e) {}
  });
}
document.getElementById('reload').onclick = loadList;
loadList();
</script>
</body>
</html>
