<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新建项目 - CF 部署工具</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f5;color:#333;padding:15px;font-size:14px}
header{background:linear-gradient(135deg,#28a745,#1e7e34);color:white;padding:14px 16px;border-radius:12px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:17px}
header a{color:white;text-decoration:none;background:rgba(255,255,255,0.2);padding:6px 12px;border-radius:6px;font-size:12px}
.card{background:white;padding:16px;border-radius:10px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,0.06)}
label{display:block;font-size:13px;font-weight:600;color:#2c3e50;margin-bottom:8px}
input,textarea{width:100%;padding:12px 14px;border:2px solid #e9ecef;border-radius:8px;font-size:14px;background:#f8f9fa;margin-bottom:16px;font-family:inherit}
input:focus,textarea:focus{outline:none;border-color:#28a745;background:white}
textarea{min-height:180px;font-family:Menlo,monospace;font-size:12px}
button{padding:14px;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;background:linear-gradient(135deg,#28a745,#1e7e34);color:white;width:100%}
button:disabled{opacity:.5;cursor:not-allowed}
.hint{font-size:12px;color:#6c757d;margin-top:-10px;margin-bottom:16px;line-height:1.6}
.checkbox-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.checkbox-row input{width:20px;height:20px;margin:0;flex-shrink:0}
.checkbox-row label{margin:0;font-weight:500;font-size:13px}
.msg{padding:12px;border-radius:8px;font-size:13px;margin-top:12px;display:none;word-break:break-all}
.msg-ok{background:#d4edda;color:#155724}
.msg-err{background:#f8d7da;color:#721c24}
h3{font-size:14px;margin:10px 0 12px;color:#495057}
</style>
</head>
<body>
<header>
  <h1>新建项目</h1>
  <a href="/">返回主页</a>
</header>

<div class="card">
  <h3>基础信息</h3>
  <label>项目名称（用于显示和本地目录）</label>
  <input id="name" placeholder="例如 iptv-config">
  <label>Worker 名称</label>
  <input id="workerName" placeholder="例如 iptv-config">
  <label>KV 名称</label>
  <input id="kvName" placeholder="例如 iptv-kv">
  <label>KV 绑定变量名</label>
  <input id="kvBinding" value="CONFIG_KV">

  <h3>初始 Worker 代码</h3>
  <div class="hint">留空会用默认 "Hello from worker" 代码。也可以粘贴你的 worker.js。</div>
  <textarea id="initialCode" placeholder="// 留空使用默认代码"></textarea>

  <button id="createBtn">创建项目</button>
  <div class="msg" id="msg"></div>
</div>

<script>
document.getElementById('createBtn').onclick = async function(){
  var btn = document.getElementById('createBtn');
  var msg = document.getElementById('msg');
  var name = document.getElementById('name').value.trim();
  var workerName = document.getElementById('workerName').value.trim();
  var kvName = document.getElementById('kvName').value.trim();
  var kvBinding = document.getElementById('kvBinding').value.trim() || 'CONFIG_KV';
  var initialCode = document.getElementById('initialCode').value;

  if (!name || !workerName || !kvName) {
    msg.textContent = '项目名、Worker 名、KV 名都必须填';
    msg.className = 'msg msg-err';
    msg.style.display = 'block';
    return;
  }

  btn.disabled = true;
  btn.textContent = '创建中（10-30 秒）...';
  msg.style.display = 'none';

  try {
    var res = await fetch('/api/project/create', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name, workerName: workerName, kvName: kvName, kvBinding: kvBinding, initialCode: initialCode })
    });
    var data = await res.json();
    if (!data.success) {
      msg.textContent = '创建失败：' + (data.error || '未知错误');
      msg.className = 'msg msg-err';
      msg.style.display = 'block';
      btn.disabled = false;
      btn.textContent = '创建项目';
      return;
    }
    msg.textContent = '创建成功！正在跳转...';
    msg.className = 'msg msg-ok';
    msg.style.display = 'block';
    setTimeout(function(){ location.href = '/'; }, 2500);
  } catch (e) {
    msg.textContent = '请求失败：' + e.message;
    msg.className = 'msg msg-err';
    msg.style.display = 'block';
    btn.disabled = false;
    btn.textContent = '创建项目';
  }
};
</script>
</body>
</html>
